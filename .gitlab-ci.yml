stages:
  - build

variables:
  ANDROID_SDK_ROOT: /opt/android-sdk
  JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

build:
  stage: build
  image: eclipse-temurin:17-jdk
  before_script:
    - apt-get update && apt-get install -y curl unzip git
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - mkdir -p $ANDROID_SDK_ROOT
    - curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
    - unzip -q cmdtools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
    - export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
    - yes | sdkmanager --licenses > /dev/null 2>&1
    - sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
  script:
    - cd frontend
    - npm install
    - npm run build
    - npx cap sync android
    - cd android
    - chmod +x gradlew
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - frontend/android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 30 days
